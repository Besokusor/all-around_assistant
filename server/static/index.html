<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>All-Around Assistant</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-header">
    <h2>历史会话</h2>
    <button id="btn-new-session" title="新建会话">+</button>
  </div>
  <ul id="session-list"></ul>
</aside>

<!-- Chat Panel -->
<main id="chat-panel">
  <header id="chat-header">
    <button id="btn-toggle-sidebar" class="icon-btn">☰</button>
    <h2 id="session-title">个人全能助手</h2>
    <button id="btn-toggle-knowledge" class="icon-btn" title="知识库">📚</button>
  </header>

  <div id="messages-container"></div>

  <div id="input-area">
    <div id="image-preview-container" style="display:none">
      <img id="image-preview" src="" alt="Preview">
      <button id="btn-remove-image">✕</button>
    </div>
    <div class="input-row">
      <button id="btn-upload-image" title="上传图片">🖼️</button>
      <input type="file" id="file-image-input" accept="image/*" style="display:none">
      <textarea id="chat-input" rows="1" placeholder="输入你的问题... (Enter 发送, Shift+Enter 换行)"></textarea>
      <button id="btn-send" title="发送">➤</button>
    </div>
  </div>
</main>

<!-- Knowledge Panel (sidebar toggle) -->
<aside id="knowledge-panel" class="hidden">
  <div class="sidebar-header">
    <h2>📚 知识库</h2>
    <button id="btn-close-knowledge" class="icon-btn">✕</button>
  </div>
  <div class="upload-zone" id="doc-upload-zone">
    <span>📤 拖拽或点击上传文档</span>
    <span class="hint">支持 PDF, Word, Markdown, TXT 等</span>
    <input type="file" id="file-doc-input" accept=".pdf,.txt,.md,.docx,.csv,.json,.py,.js,.ts" style="display:none">
  </div>
  <div id="doc-list"></div>
  <div class="qa-section">
    <h3>🔍 知识问答</h3>
    <input type="text" id="qa-input" placeholder="对文档提问...">
    <button id="btn-qa-send">提问</button>
    <div id="qa-result"></div>
  </div>
</aside>

<script src="/js/app.js"></script>
<script src="/js/sessions.js"></script>
<script src="/js/documents.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
